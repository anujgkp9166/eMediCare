{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="container page-head"><h1 style="font-size:2rem">Change password</h1></div>
<div class="container page-body"><form method="post" class="card form-card" novalidate>{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include "partials/field.html" %}{% endfor %}
  <button class="btn btn-primary" type="submit">Update password</button>
</form></div>
{% endblock %}
